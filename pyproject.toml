[tool.pytest.ini_options]
testpaths = ["project X/tests"]
python_files = ["test_*.py"]
# Display each validator and its explicit PASS/FAIL line for a plain
# `python -m pytest` invocation.
addopts = "-p no:cacheprovider -v -s"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
